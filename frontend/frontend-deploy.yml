apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: prachi0612/easycrud2-jenkins:frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 80
